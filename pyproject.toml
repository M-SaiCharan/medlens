[project]
name = "medlens"
version = "0.1.0"
description = "Scan medicines, find cheaper generics, catch dangerous interactions."
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
